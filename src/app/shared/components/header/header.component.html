<header style="display: flex; justify-content: space-between; align-items: center;">
    <div class="navbar-brand brand-name">
        <a>
            <img class="img-responsive img-responsive"
                src="https://app.axisrooms.com/static/images/ar_logo_white_h30.png" alt="AxisRooms"
                width="300" height="150"></a>
    </div>

    <div class="header-right-section">
        <!-- Language Selector -->
        <div class="language-selector" (clickOutside)="closeLangDropdown()">
            <button class="lang-btn" (click)="toggleLangDropdown()">
                <span class="lang-flag">{{ getCurrentLanguageDisplay()?.flag }}</span>
                <span class="lang-code">{{ getCurrentLanguageDisplay()?.code?.toUpperCase() }}</span>
                <i class="bi bi-chevron-down" [class.rotated]="isLangDropdownOpen"></i>
            </button>
            
            <div class="lang-dropdown" *ngIf="isLangDropdownOpen">
                <div class="lang-dropdown-header">
                    {{ 'select_language' | translate }}
                </div>
                <div class="lang-options">
                    <button 
                        *ngFor="let lang of languages" 
                        class="lang-option" 
                        [class.active]="currentLang === lang.code"
                        (click)="selectLanguage(lang.code)">
                        <span class="lang-flag">{{ lang.flag }}</span>
                        <span class="lang-name">{{ lang.name }}</span>
                        <i class="bi bi-check2" *ngIf="currentLang === lang.code"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>
</header>
