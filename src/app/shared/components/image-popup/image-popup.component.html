<div class="image-popup-container">
    <!-- Close button -->
    <button class="close-btn" (click)="onNoClick()">
        <i class="bi bi-x-lg"></i>
    </button>

    <!-- Previous button -->
    <button class="nav-btn prev-btn" (click)="prevImage()" *ngIf="images.length > 1">
        <i class="bi bi-chevron-left"></i>
    </button>

    <!-- Image -->
    <div class="image-wrapper">
        <img [src]="currentImage" alt="Gallery Image" class="popup-image">
    </div>

    <!-- Next button -->
    <button class="nav-btn next-btn" (click)="nextImage()" *ngIf="images.length > 1">
        <i class="bi bi-chevron-right"></i>
    </button>

    <!-- Image counter -->
    <div class="image-counter" *ngIf="images.length > 1">
        {{ currentIndex + 1 }} / {{ images.length }}
    </div>
</div>
